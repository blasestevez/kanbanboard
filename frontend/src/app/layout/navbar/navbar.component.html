<header class="navbar">
  <div class="navbar-left">
    <button
      type="button"
      class="btn-icon btn-hamburger"
      (click)="onToggleSidebar()"
      aria-label="Toggle navigation sidebar"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <a routerLink="/" class="navbar-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="4" fill="currentColor" />
        <rect x="4" y="4" width="6.5" height="13" rx="1.5" fill="white" />
        <rect x="13.5" y="4" width="6.5" height="8.5" rx="1.5" fill="white" />
      </svg>
      <span class="brand-text">Trellochocero</span>
    </a>
  </div>

  <div class="navbar-right">
    @if (currentUser()) {
      <div class="user-menu-wrapper">
        <button
          type="button"
          class="btn-avatar"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isDropdownOpen()"
          aria-haspopup="true"
        >
          @if (currentUser()?.avatarUrl) {
            <img
              [src]="currentUser()?.avatarUrl"
              [alt]="currentUser()?.fullName"
              class="avatar-img"
            />
          } @else {
            <span class="avatar-initials">{{ userInitials() }}</span>
          }
        </button>

        @if (isDropdownOpen()) {
          <div class="dropdown-menu" role="menu">
            <div class="dropdown-header">
              <span class="user-name">{{ currentUser()?.fullName }}</span>
              <span class="user-email">{{ currentUser()?.email }}</span>
            </div>

            <div class="dropdown-divider"></div>

            <button
              type="button"
              class="dropdown-item"
              role="menuitem"
              (click)="closeMenu()"
            >
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
              </svg>
              <span>Profile</span>
            </button>

            <button
              type="button"
              class="dropdown-item"
              role="menuitem"
              (click)="closeMenu()"
            >
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
              </svg>
              <span>Settings</span>
            </button>

            <div class="dropdown-divider"></div>

            <button
              type="button"
              class="dropdown-item dropdown-item-danger"
              role="menuitem"
              (click)="onLogout()"
            >
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" />
              </svg>
              <span>Log out</span>
            </button>
          </div>
        }
      </div>
    } @else {
      <div class="auth-nav-links">
        <a routerLink="/auth/login" class="btn-nav-login">Log In</a>
        <a routerLink="/auth/register" class="btn-nav-register">Sign Up</a>
      </div>
    }
  </div>
</header>
